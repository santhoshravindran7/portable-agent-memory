<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>PAM</title>
  <link rel="stylesheet" href="popup.css">
</head>
<body>
  <div class="popup-container">
    <!-- Header -->
    <header class="header">
      <div class="header-left">
        <div class="logo">
          <svg viewBox="0 0 24 24" width="20" height="20">
            <path fill="#4ea8de" d="M12 2a9 9 0 0 0-9 9c0 3.07 1.53 5.78 3.87 7.41C8.24 19.41 10.03 20 12 20s3.76-.59 5.13-1.59C19.47 16.78 21 14.07 21 11a9 9 0 0 0-9-9zm0 16c-3.87 0-7-3.13-7-7s3.13-7 7-7 7 3.13 7 7-3.13 7-7 7zm1-11h-2v3H8v2h3v3h2v-3h3v-2h-3V7z"/>
          </svg>
        </div>
        <h1>PAM</h1>
      </div>
      <button class="icon-btn" id="settings-btn" title="Settings">
        <svg viewBox="0 0 24 24" width="18" height="18">
          <path fill="currentColor" d="M19.14 12.94c.04-.3.06-.61.06-.94 0-.32-.02-.64-.07-.94l2.03-1.58a.49.49 0 0 0 .12-.61l-1.92-3.32a.49.49 0 0 0-.59-.22l-2.39.96c-.5-.38-1.03-.7-1.62-.94l-.36-2.54a.484.484 0 0 0-.48-.41h-3.84c-.24 0-.43.17-.47.41l-.36 2.54c-.59.24-1.13.57-1.62.94l-2.39-.96a.49.49 0 0 0-.59.22L2.74 8.87c-.12.21-.08.47.12.61l2.03 1.58c-.05.3-.09.63-.09.94s.02.64.07.94l-2.03 1.58a.49.49 0 0 0-.12.61l1.92 3.32c.12.22.37.29.59.22l2.39-.96c.5.38 1.03.7 1.62.94l.36 2.54c.05.24.24.41.48.41h3.84c.24 0 .44-.17.47-.41l.36-2.54c.59-.24 1.13-.56 1.62-.94l2.39.96c.22.08.47 0 .59-.22l1.92-3.32c.12-.22.07-.47-.12-.61l-2.01-1.58zM12 15.6c-1.98 0-3.6-1.62-3.6-3.6s1.62-3.6 3.6-3.6 3.6 1.62 3.6 3.6-1.62 3.6-3.6 3.6z"/>
        </svg>
      </button>
    </header>

    <!-- Stats -->
    <div class="stats" id="stats">
      <span class="stat-item"><span class="stat-count" id="stat-episodic">0</span> episodes</span>
      <span class="stat-divider">·</span>
      <span class="stat-item"><span class="stat-count" id="stat-semantic">0</span> facts</span>
      <span class="stat-divider">·</span>
      <span class="stat-item"><span class="stat-count" id="stat-procedural">0</span> skills</span>
    </div>

    <!-- Quick Remember -->
    <div class="section">
      <div class="input-group">
        <input type="text" id="remember-input" placeholder="Remember something..." autocomplete="off">
        <button class="btn btn-primary" id="remember-btn">Remember</button>
      </div>
      <div class="memory-type-row">
        <select id="memory-type">
          <option value="episodic">Episode</option>
          <option value="semantic">Fact</option>
          <option value="procedural">Skill</option>
          <option value="working">Working</option>
        </select>
      </div>
    </div>

    <!-- Semantic form (hidden by default) -->
    <div class="section semantic-form" id="semantic-form" style="display:none;">
      <input type="text" id="sem-subject" placeholder="Subject" class="sem-input">
      <input type="text" id="sem-predicate" placeholder="Predicate (e.g., 'is', 'likes')" class="sem-input">
      <input type="text" id="sem-object" placeholder="Object" class="sem-input">
    </div>

    <!-- Procedural form (hidden by default) -->
    <div class="section procedural-form" id="procedural-form" style="display:none;">
      <input type="text" id="proc-name" placeholder="Skill name" class="sem-input">
      <input type="text" id="proc-desc" placeholder="Description" class="sem-input">
    </div>

    <!-- Actions -->
    <div class="section actions">
      <button class="btn btn-action" id="inject-btn">
        <svg viewBox="0 0 24 24" width="14" height="14"><path fill="currentColor" d="M21 3H3c-1.1 0-2 .9-2 2v14c0 1.1.9 2 2 2h18c1.1 0 2-.9 2-2V5c0-1.1-.9-2-2-2zm0 16H3V5h18v14zM5 15h14v2H5z"/></svg>
        Inject into Chat
      </button>
      <button class="btn btn-action" id="export-btn">
        <svg viewBox="0 0 24 24" width="14" height="14"><path fill="currentColor" d="M19 9h-4V3H9v6H5l7 7 7-7zM5 18v2h14v-2H5z"/></svg>
        Export .pam
      </button>
      <button class="btn btn-action" id="import-btn">
        <svg viewBox="0 0 24 24" width="14" height="14"><path fill="currentColor" d="M9 16h6v-6h4l-7-7-7 7h4zm-4 2h14v2H5z"/></svg>
        Import .pam
      </button>
    </div>

    <!-- Hidden file input -->
    <input type="file" id="import-file" accept=".pam,.json" style="display:none;">

    <!-- Recent memories preview -->
    <div class="section">
      <h3 class="section-title">Recent Memories</h3>
      <div class="memory-list" id="memory-list">
        <div class="empty-state">No memories yet. Start remembering!</div>
      </div>
    </div>

    <!-- Footer -->
    <footer class="footer">
      <span>PAM v0.1.0</span>
      <a href="#" id="open-sidebar">Open full view →</a>
    </footer>
  </div>

  <script src="../lib/pam-core.js"></script>
  <script src="popup.js"></script>
</body>
</html>
